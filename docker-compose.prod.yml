version: '3.8'
services:
  db:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_USER: brickfarm
      POSTGRES_PASSWORD: brickfarm_pass
      POSTGRES_DB: brickfarm
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.prod
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db_data_prod:
