name: Integration Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch: {}

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_USER: brick
          POSTGRES_PASSWORD: brickpass
          POSTGRES_DB: brickfarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libpq-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install .

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U brick; do sleep 1; done

      - name: Run alembic migrations
        run: alembic upgrade head

      - name: Seed DB
        run: psql "postgresql://brick:brickpass@localhost:5432/brickfarm" -f infra/scripts/seed_reports.sql

      - name: Run tests
        run: pytest -q
