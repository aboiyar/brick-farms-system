version: '3.8'
services:
  db:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: brickfarm
      POSTGRES_PASSWORD: brickfarm_pass
      POSTGRES_DB: brickfarm
    ports:
      # Map container port 5432 to host 5433 to avoid colliding with a host postgres on 5432
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      # Map container redis port 6379 to host 6380 to avoid colliding with host redis
      - "6380:6379"

volumes:
  db_data:
