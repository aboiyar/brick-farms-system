[project]
name = "brickfarm-backend"
version = "0.1.0"
description = "BrickFarm backend (FastAPI + Postgres/PostGIS/Timescale)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "sqlalchemy==2.0.34",
  "asyncpg==0.29.0",
  "alembic==1.13.2",
  "psycopg[binary,pool]==3.2.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.9",
  "redis==5.0.8",
  "boto3==1.34.162",
  "orjson==3.10.7",
  "shapely==2.0.4",
  "geoalchemy2==0.15.2",
  "httpx==0.27.0",
  "tenacity==9.0.0",
  "structlog==24.1.0",
  "reportlab==4.4.4",
  "statsmodels==0.14.0"
]

# Add reporting and forecasting libs
dependencies_extra = [
]

# Promote reporting libs into main dependencies so CI installs them
[tool.reporting]
extras = [
  "reportlab==4.1.4",
  "statsmodels==0.14.0"
]

[tool.pytest.ini_options]
markers = ["asyncio"]

[tool.alembic]
script_location = "app/db/migrations"
sqlalchemy_url = "postgresql+psycopg://{env:DB_USER}:{env:DB_PASS}@{env:DB_HOST}:{env:DB_PORT}/{env:DB_NAME}"
