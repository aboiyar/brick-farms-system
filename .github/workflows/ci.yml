name: CI

on:
  push:
    branches: [ main, master, dev-local-unified ]
  pull_request:
    branches: [ main, master, dev-local-unified ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  backend-test:
    name: Backend: Install & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (best-effort)
        working-directory: ./backend
        run: |
          # Run unit tests; skip integration tests if they require DB
          if command -v pytest; then
            pytest -q -k "not integration"
          else
            echo "pytest not installed"
          fi

  alembic-check:
    name: Alembic: Migration Check
    needs: backend-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brickfarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install psql tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do pg_isready -h localhost -p 5432 -U postgres && break || sleep 1; done

      - name: Run Alembic upgrade head
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brickfarm
        run: |
          python -m alembic upgrade head
          python -m alembic current

  build-and-push:
    name: Build and Publish Docker Images
    needs: [backend-test, alembic-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/brickfarm-backend:latest
            ghcr.io/${{ github.repository_owner }}/brickfarm-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-web
          file: ./frontend-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/brickfarm-frontend:latest
            ghcr.io/${{ github.repository_owner }}/brickfarm-frontend:${{ github.sha }}

  deploy-ec2:
    name: Deploy (manual, optional)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH (requires secrets)
        if: secrets.EC2_SSH_PRIVATE_KEY && secrets.EC2_USER && secrets.EC2_HOST
        run: |
          echo "Deploying to EC2..."
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'docker pull ghcr.io/${{ github.repository_owner }}/brickfarm-backend:latest && docker pull ghcr.io/${{ github.repository_owner }}/brickfarm-frontend:latest && cd /opt/brickfarm && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans'
